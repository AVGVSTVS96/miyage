<!doctype html>
<meta charset="utf-8" />
<title>miyage lettermarks</title>
<style>
  * { box-sizing: border-box; margin: 0 }
  body { background: #0e0e0e; width: 1200px; padding: 40px; font: 500 26px/1 Inter, system-ui, sans-serif; color: #8a867e }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 40px }
  .big { display: block; width: 100%; border-radius: 22%; border: 1px solid #2c2c2c }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding: 0 6px }
  .row div { display: flex; align-items: center; gap: 12px }
  .row img { display: block; border-radius: 22%; border: 1px solid #2c2c2c }
</style>
<div class="grid"></div>
<script>
  document.querySelector(".grid").innerHTML = ["1-italic", "2-serif", "3-capital", "4-hairline", "5-arches", "6-thin"].map((n) =>
    `<div><img class="big" src="${n}.svg"><div class="row"><span>${n[0]}</span><div>` +
    [60, 32, 16].map((s) => `<img src="${n}.svg" width="${s}" height="${s}">`).join("") + `</div></div></div>`).join("")
</script>
